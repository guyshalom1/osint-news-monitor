name: Collect and report

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # allow a manual run from the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect articles
        run: python -m osint_monitor --db data/articles.db collect

      - name: Backfill history from GDELT
        timeout-minutes: 8
        continue-on-error: true   # GDELT is a bonus source; RSS collection must not depend on it
        run: python -m osint_monitor --db data/articles.db backfill --keywords Iran Iranian Tehran --days 7

      - name: Build report
        run: python -m osint_monitor --db data/articles.db report --keywords Iran Iranian Tehran --days 7 --out reports/latest

      - name: Save results to the repository
        run: |
          git config user.name "osint-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Update data and report $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Open an issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scheduled collection failed"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" \
              --body "Run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
