name: Collect and report

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test
        run: pytest -q

      - name: Collect articles
        run: python -m osint_monitor --db data/articles.db collect

      - name: Build report
        run: python -m osint_monitor --db data/articles.db report --keywords Iran Iranian Tehran --days 7 --out reports/latest

      - name: Save results to the repository
        run: |
          git config user.name "osint-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Update data and report $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
