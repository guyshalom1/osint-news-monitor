name: Probe Iran feeds (temporary)

on:
  push:
    branches: [improve-assessment-iran-pole]
    paths: [".github/workflows/probe-iran-feeds.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - name: Inspect working feeds
        run: |
          python - <<'PY'
          import feedparser
          URLS = {
              "Mehr": "https://en.mehrnews.com/rss",
              "TehranTimes": "https://www.tehrantimes.com/rss",
              "IRNA": "https://en.irna.ir/rss",
              "PressTV": "https://www.presstv.ir/rss.xml",
          }
          for name, url in URLS.items():
              f = feedparser.parse(url, agent="Mozilla/5.0 (osint-news-monitor probe)")
              print(f"::notice title=probe::{name}: href={f.get('href')} n={len(f.entries)} bozo={f.bozo} exc={str(f.get('bozo_exception'))[:80]}")
              for e in f.entries[:4]:
                  print(f"::notice title=probe::{name} | {e.get('title','')[:70]} | pub={e.get('published') or e.get('updated') or e.get('pubDate')} | keys={sorted(e.keys())[:12]}")
          PY
