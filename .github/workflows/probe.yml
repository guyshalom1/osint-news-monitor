name: Probe feeds (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install feedparser
      - shell: python
        run: |
          import feedparser
          urls = [
            "https://www.ynetglobal.com/Integration/StoryRss3082.xml",
            "https://www.ynetglobal.com/Integration/StoryRss3089.xml",
            "https://www.ynetglobal.com/rss",
            "https://www.ynetglobal.com/feed",
            "https://www.ynetnews.com/Integration/StoryRss3082.xml",
            "https://www.ynetnews.com/Integration/StoryRss1854.xml",
            "https://www.ynet.co.il/Integration/StoryRss2.xml",
            "https://www.ynet.co.il/Integration/StoryRss1854.xml",
          ]
          for u in urls:
              f = feedparser.parse(u, agent="Mozilla/5.0")
              dates = sorted(e.get("published", "") for e in f.entries)
              newest = f.entries[0].get("published", "?") if f.entries else "-"
              first = f.entries[0].get("title", "")[:60] if f.entries else str(getattr(f, "bozo_exception", ""))[:60]
              print(f"::notice::{len(f.entries)} items | newest {newest} | {u} | {first}")
