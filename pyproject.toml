[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osint-news-monitor"
dynamic = ["version"]
description = "Tracks how a topic is covered across open news sources and writes a rule-based analytic brief."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guy Shalom" }]
keywords = ["osint", "news", "media-monitoring", "rss", "gdelt", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "feedparser>=6.0",
    "jinja2>=3.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Named-entity recognition. Also needs the model:
#   python -m spacy download en_core_web_sm
nlp = ["spacy>=3.7,<4"]
# PDF version of the brief.
pdf = ["weasyprint>=62"]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
osint-monitor = "osint_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/guyshalom1/osint-news-monitor"
Issues = "https://github.com/guyshalom1/osint-news-monitor/issues"

[tool.hatch.version]
path = "osint_monitor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["osint_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "PTH"]
ignore = ["B905"]   # zip(strict=) adds noise where lengths match by construction

[tool.mypy]
python_version = "3.10"
packages = ["osint_monitor"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["feedparser", "spacy", "weasyprint"]
ignore_missing_imports = true
